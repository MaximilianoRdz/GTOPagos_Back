services:
  db:
    image: postgres:16-alpine
    container_name: gtopagos_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-gtopagos}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres123}
    ports:
      - "127.0.0.1:${DB_EXTERNAL_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-gtopagos}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gtopagos_backend
    restart: unless-stopped
    environment:
      DEBUG: "False"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-xqxxpV8gbw5UBrqDYuGaEuc6MuqEj7DkHyTjT_c4aHlkPpzr2Vog3XE_cNtDS8Riwtw}
      DB_NAME: ${DB_NAME:-gtopagos}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres123}
      DB_HOST: db
      DB_PORT: "5432"
      ALLOWED_HOSTS: "api.maxrdzs.com,localhost,127.0.0.1,backend"
      CORS_ALLOW_ALL_ORIGINS: "False"
      CORS_ALLOWED_ORIGINS: "https://gtopagos.maxrdzs.com,http://localhost:4200,http://127.0.0.1:4200"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - media_data:/app/media

  nginx:
    image: nginx:alpine
    container_name: gtopagos_nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
      - "1451:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - media_data:/app/media:ro
    depends_on:
      - backend

volumes:
  postgres_data:
  media_data:
